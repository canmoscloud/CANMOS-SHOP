name: canmos_shop
description: "CANMOS-SHOP - Sistema PDV Completo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.2

  # Persistencia local (preferencia de tema)
  shared_preferences: ^2.2.3

  # Stripe
  flutter_stripe: ^11.0.0

  # Barcode Scanner
  mobile_scanner: ^6.0.0

  # Utils
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  printing: ^5.12.0
  pdf: ^3.11.0
  fl_chart: ^0.68.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
