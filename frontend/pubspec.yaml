name: canmos_shop
description: "CANMOS-SHOP - Sistema PDV Completo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.2

  # Stripe
  flutter_stripe: ^11.0.0

  # Barcode Scanner
  mobile_scanner: ^6.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utils
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  printing: ^5.12.0
  path_provider: ^2.1.3
  pdf: ^3.11.0
  brasil_fields: ^1.15.0
  mask_text_input_formatter: ^2.9.0
  fl_chart: ^0.68.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
