[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[storage]
enabled = true
file_size_limit = "5MB"

[storage.buckets.produtos]
public = true
file_size_limit = "5MB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/gif"]

[db]
port = 54322
shadow_port = 54320

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[analytics]
enabled = false

